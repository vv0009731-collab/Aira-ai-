          package com.vineet.dost

          import org.json.JSONObject

          /** Demo mode: bina API key ke chhote-mote jawab aur phone ke kaam (Claude ki jagah). */
          object LocalBrain {

              private fun clean(t: String, vararg words: String): String {
                  var s = " $t "
                  for (w in words) s = s.replace(Regex("(?i)\\s${Regex.escape(w)}(?=\\s)"), " ")
                  return s.trim().replace(Regex("\\s+"), " ")
              }

              fun reply(raw: String): Reply {
                  val t = raw.lowercase().trim().replace(Regex("[?!.,]"), " ").replace(Regex("\\s+"), " ")
                  fun has(vararg k: String) = k.any { t.contains(it) }

                  if (has("lock", "लॉक"))
                      return Reply("Lo, screen lock kar rahi hoon!", listOf("lock_screen" to JSONObject()))

                  if (has("kholo", "khol do", "khol de", "open", "खोलो")) {
                      val app = clean(t, "kholo", "khol", "do", "de", "open", "karo", "app", "ko", "please", "mujhe", "ek", "खोलो")
                      if (app.isNotBlank())
                          return Reply("Lo, $app khol rahi hoon!", listOf("open_app" to JSONObject().put("app_name", app)))
                  }

                  if (has("search", "google", "dhundo", "khojo", "dhoondo")) {
                      val q = clean(t, "search", "google", "karo", "kar", "do", "dhundo", "khojo", "dhoondo", "par", "pe", "mein", "me", "ko", "please", "mujhe")
                      return Reply("Google par dhundh rahi hoon!", listOf("web_search" to JSONObject().put("query", q.ifBlank { raw })))
                  }

                  if (has("gaana", "gana", "song", "music", "chalao", "chala do", "play", "sunao")) {
                      val song = clean(t, "gaana", "gana", "song", "music", "chalao", "chala", "do", "play", "karo", "ek", "koi", "mujhe", "sunao", "ka", "ki", "ke")
                      return Reply("Ye lo, gaana chala rahi hoon!", listOf("play_music" to JSONObject().put("song", song.ifBlank { "latest hindi songs" })))
                  }

                  val text = when {
                      has("kaisi ho", "kaise ho", "kya haal", "how are you") ->
                          "Main ekdum mast hoon! Tum batao, aaj ka din kaisa gaya?"
                      has("hello", "hii", "hey", "namaste", "hi ") || t == "hi" ->
                          "Heyy! Bolo bolo, kya chal raha hai?"
                      has("udaas", "dukhi", "sad", "bura lag", "rona") ->
                          "Arre, kya hua? Main yahin hoon, aaram se batao."
                      has("khush", "happy", "mast", "maza") ->
                          "Wah! Sunke achha laga, party to banti hai!"
                      has("naam", "kaun ho", "who are you") ->
                          "Main tumhari dost Aira hoon. Abhi demo mode mein hoon, key daaloge to pura dimaag chalega!"
                      has("thank", "shukriya", "dhanyavad") ->
                          "Arre yaar, isme thank you kaisa! 😄"
                      has("bye", "alvida", "chalta hoon") ->
                          "Chalo phir milte hain, apna khayal rakhna!"
                      else ->
                          "Demo mode mein hoon, to main sirf app kholna, search, gaana aur lock kar sakti hoon. Asli baat-cheet ke liye API key daalo!"
                  }
                  return Reply(text, emptyList())
              }
          }
