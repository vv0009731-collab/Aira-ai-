          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/Actions.kt" <<'__EOF__'
          package com.vineet.dost

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.provider.MediaStore
          import android.provider.Settings
          import org.json.JSONObject
          import java.net.URLEncoder

          object Actions {

              /** Tool call chalata hai aur ek chhota result string lautata hai. */
              fun run(ctx: Context, name: String, input: JSONObject): String = try {
                  when (name) {
                      "open_app" -> openApp(ctx, input.optString("app_name"))
                      "web_search" -> webSearch(ctx, input.optString("query"))
                      "play_music" -> playMusic(ctx, input.optString("song"))
                      "lock_screen" -> lockScreen(ctx)
                      else -> "unknown action"
                  }
              } catch (e: Exception) {
                  "error: ${e.message}"
              }

              private fun start(ctx: Context, i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
              }

              private fun openApp(ctx: Context, name: String): String {
                  val pm = ctx.packageManager
                  val launcher = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcher, 0)
                  val q = name.trim().lowercase()
                  val match = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "app not found: $name"
                  val i = pm.getLaunchIntentForPackage(match.activityInfo.packageName)
                      ?: return "cannot launch $name"
                  start(ctx, i)
                  return "opened ${match.loadLabel(pm)}"
              }

              private fun webSearch(ctx: Context, q: String): String {
                  val url = "https://www.google.com/search?q=" + URLEncoder.encode(q, "UTF-8")
                  start(ctx, Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                  return "searched: $q"
              }

              private fun playMusic(ctx: Context, song: String): String {
                  return try {
                      val i = Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH).apply {
                          putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*")
                          putExtra(android.app.SearchManager.QUERY, song)
                      }
                      start(ctx, i)
                      "playing: $song"
                  } catch (e: Exception) {
                      val url = "https://www.youtube.com/results?search_query=" + URLEncoder.encode(song, "UTF-8")
                      start(ctx, Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                      "opened youtube search: $song"
                  }
              }

              private fun lockScreen(ctx: Context): String {
                  return if (LockService.lock()) {
                      "locked"
                  } else {
                      start(ctx, Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      "accessibility service off - opened settings so user can enable Aira Screen Lock"
                  }
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/Analyzer.kt" <<'__EOF__'
          package com.vineet.dost

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import android.content.Context
          import org.json.JSONObject
          import java.io.File
          import java.nio.FloatBuffer
          import kotlin.math.exp
          import kotlin.math.sqrt

          /** Asli ML: speaker embedding (kaun bol raha hai) + speech emotion (kaise bol raha hai). */
          object Analyzer {
              private var env: OrtEnvironment? = null
              private var spk: OrtSession? = null
              private var emo: OrtSession? = null
              private var labels: List<String> = emptyList()

              @Volatile var spkReady = false
              @Volatile var emoReady = false

              fun init(ctx: Context) {
                  try { env = OrtEnvironment.getEnvironment() } catch (e: Throwable) { return }
                  spk = load(ctx, "speaker.onnx"); spkReady = spk != null
                  emo = load(ctx, "emotion.onnx"); emoReady = emo != null
                  try {
                      val txt = ctx.assets.open("emotion_config.json").bufferedReader().readText()
                      val m = JSONObject(txt).getJSONObject("id2label")
                      labels = m.keys().asSequence().map { it.toInt() }.sorted().map { m.getString(it.toString()).lowercase() }.toList()
                  } catch (e: Exception) { emoReady = false }
              }

              private fun load(ctx: Context, asset: String): OrtSession? {
                  val f = File(ctx.filesDir, asset)
                  return try {
                      if (!f.exists() || f.length() == 0L) {
                          ctx.assets.open(asset).use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      }
                      env!!.createSession(f.absolutePath, OrtSession.SessionOptions())
                  } catch (e: Throwable) {
                      f.delete(); null
                  }
              }

              /** Speaker embedding (L2-normalized). */
              fun embedding(pcm: ShortArray): FloatArray? {
                  val s = spk ?: return null
                  return try {
                      val fb = Fbank.compute(pcm) ?: return null
                      val t = fb.size
                      val flat = FloatArray(t * 80)
                      for (i in 0 until t) System.arraycopy(fb[i], 0, flat, i * 80, 80)
                      OnnxTensor.createTensor(env, FloatBuffer.wrap(flat), longArrayOf(1, t.toLong(), 80)).use { tensor ->
                          s.run(mapOf(s.inputNames.first() to tensor)).use { r ->
                              val v = r.get(0).value
                              val e = if (v is Array<*>) v[0] as FloatArray else v as FloatArray
                              l2(e)
                          }
                      }
                  } catch (e: Throwable) { null }
              }

              /** Emotion: (label, probability). */
              fun emotion(pcm: ShortArray): Pair<String, Float>? {
                  val s = emo ?: return null
                  if (labels.isEmpty() || pcm.size < 8000) return null
                  return try {
                      val n = minOf(pcm.size, 16000 * 10)
                      val x = FloatArray(n) { pcm[pcm.size - n + it] / 32768f }
                      var mean = 0f; for (v in x) mean += v; mean /= n
                      var varr = 0f; for (v in x) varr += (v - mean) * (v - mean); varr /= n
                      val inv = 1f / sqrt(varr + 1e-7f)
                      for (i in x.indices) x[i] = (x[i] - mean) * inv
                      OnnxTensor.createTensor(env, FloatBuffer.wrap(x), longArrayOf(1, n.toLong())).use { tensor ->
                          s.run(mapOf(s.inputNames.first() to tensor)).use { r ->
                              val logits = (r.get(0).value as Array<*>)[0] as FloatArray
                              val mx = logits.max()
                              val ex = logits.map { exp((it - mx).toDouble()).toFloat() }
                              val sum = ex.sum()
                              val best = ex.indices.maxByOrNull { ex[it] }!!
                              labels.getOrElse(best) { "neutral" } to ex[best] / sum
                          }
                      }
                  } catch (e: Throwable) { null }
              }

              fun cosine(a: FloatArray, b: FloatArray): Float {
                  var d = 0f
                  for (i in 0 until minOf(a.size, b.size)) d += a[i] * b[i]
                  return d
              }

              fun l2(v: FloatArray): FloatArray {
                  var n = 0f; for (x in v) n += x * x
                  val s = 1f / sqrt(n + 1e-9f)
                  return FloatArray(v.size) { v[it] * s }
              }

              /** Model ke label ko hamare mood mein badlo. */
              fun toMood(label: String) = when (label) {
                  "angry", "disgust" -> "angry"
                  "fear", "fearful" -> "stressed"
                  "happy" -> "happy"
                  "surprise", "surprised" -> "excited"
                  "sad" -> "sad"
                  else -> "neutral"
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/AudioCapture.kt" <<'__EOF__'
          package com.vineet.dost

          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder

          /** Raw 16 kHz mono mic audio ko ring buffer mein rakhta hai (voice + emotion analysis ke liye). */
          class AudioCapture {
              private val sr = 16000
              private val ring = ShortArray(sr * 15)
              private var total = 0L
              private var rec: AudioRecord? = null
              @Volatile private var running = false

              fun start(): Boolean {
                  if (running) return true
                  return try {
                      val min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val r = AudioRecord(
                          MediaRecorder.AudioSource.VOICE_RECOGNITION, sr,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, maxOf(min, sr)
                      )
                      if (r.state != AudioRecord.STATE_INITIALIZED) { r.release(); return false }
                      synchronized(ring) { total = 0L }
                      rec = r
                      r.startRecording()
                      running = true
                      Thread {
                          val buf = ShortArray(1024)
                          while (running) {
                              val n = r.read(buf, 0, buf.size)
                              if (n <= 0) { if (n < 0) break else continue }
                              synchronized(ring) {
                                  for (i in 0 until n) { ring[(total % ring.size).toInt()] = buf[i]; total++ }
                              }
                          }
                      }.start()
                      true
                  } catch (e: Exception) { false }
              }

              /** Aakhri `seconds` second ki audio. */
              fun snapshot(seconds: Float): ShortArray = synchronized(ring) {
                  val want = minOf((seconds * sr).toInt(), ring.size, total.toInt())
                  ShortArray(want) { i -> ring[((total - want + i) % ring.size).toInt()] }
              }

              fun stop() {
                  running = false
                  try { rec?.stop() } catch (_: Exception) {}
                  try { rec?.release() } catch (_: Exception) {}
                  rec = null
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/FaceView.kt" <<'__EOF__'
          package com.vineet.dost

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PathMeasure
          import android.graphics.RectF
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.PI
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.random.Random

          /**
           * Aira ka animated neon chehra. Emotion ke hisaab se aankhein, muh aur glow ka rang smoothly badalte hain.
           * Pose = [upper eye: ax,ay,cx,cy,bx,by] [lower eye: ...] [mouth: x0,y0,cx,cy,x1,y1]  (left eye coordinates, right eye mirror)
           */
          class FaceView(ctx: Context) : View(ctx) {

              companion object {
                  private const val PIVOT = -170f

                  private val POSES: Map<String, Pair<FloatArray, Int>> = mapOf(
                      "happy" to (floatArrayOf(
                          -346f, -228f, -250f, -215f, -137f, -124f,
                          -346f, -66f, -250f, -90f, -137f, -124f,
                          -327f, 114f, 0f, 608f, 327f, 114f) to 0xFF4FC3FF.toInt()),
                      "neutral" to (floatArrayOf(
                          -310f, -170f, -230f, -290f, -150f, -170f,
                          -310f, -170f, -230f, -50f, -150f, -170f,
                          -150f, 180f, 0f, 260f, 150f, 180f) to 0xFF4FC3FF.toInt()),
                      "excited" to (floatArrayOf(
                          -330f, -120f, -240f, -290f, -140f, -120f,
                          -330f, -120f, -240f, -250f, -140f, -120f,
                          -340f, 70f, 0f, 760f, 340f, 70f) to 0xFFFFC857.toInt()),
                      "sad" to (floatArrayOf(
                          -320f, -120f, -240f, -215f, -140f, -250f,
                          -320f, -120f, -215f, -140f, -140f, -250f,
                          -150f, 280f, 0f, 170f, 150f, 280f) to 0xFF6B8CFF.toInt()),
                      "angry" to (floatArrayOf(
                          -330f, -250f, -230f, -250f, -130f, -130f,
                          -330f, -250f, -240f, -190f, -130f, -130f,
                          -160f, 250f, 0f, 190f, 160f, 250f) to 0xFFFF5A5A.toInt()),
                      "stressed" to (floatArrayOf(
                          -310f, -190f, -230f, -320f, -150f, -190f,
                          -310f, -190f, -230f, -40f, -150f, -190f,
                          -130f, 235f, 0f, 205f, 130f, 250f) to 0xFFB87BFF.toInt()),
                      "listening" to (floatArrayOf(
                          -320f, -170f, -230f, -310f, -140f, -170f,
                          -320f, -170f, -230f, -30f, -140f, -170f,
                          -70f, 200f, 0f, 240f, 70f, 200f) to 0xFF3DE6C8.toInt())
                  )
              }

              private val cur = POSES.getValue("happy").first.copyOf()
              private var tgt = POSES.getValue("happy").first
              private var cr = 79f; private var cg = 195f; private var cb = 255f
              private var tr = 79f; private var tg = 195f; private var tb = 255f

              private var emotion = "happy"
              private var listening = false
              private var thinking = false
              private var talking = false
              private var talkLerp = 0f
              private var thinkLerp = 0f
              private var stressLerp = 0f

              private var nextBlink = 2f
              private var blinkStart = -10f

              private var bg: Bitmap? = null

              private class Pulse(val pm: PathMeasure, val len: Float, val speed: Float, val phase: Float)
              private val pulses = mutableListOf<Pulse>()
              private val pos = FloatArray(2)
              private var lineW = 2f
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }
              private val eyeL = Path()
              private val eyeR = Path()
              private val mouth = Path()

              fun setEmotion(m: String) { emotion = if (POSES.containsKey(m)) m else "neutral"; retarget() }
              fun setListening(b: Boolean) { listening = b; retarget() }
              fun setThinking(b: Boolean) { thinking = b }
              fun setTalking(b: Boolean) { talking = b }

              private fun retarget() {
                  val key = if (listening) "listening" else emotion
                  val (pose, color) = POSES.getValue(key)
                  tgt = pose
                  tr = Color.red(color).toFloat(); tg = Color.green(color).toFloat(); tb = Color.blue(color).toFloat()
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  if (w > 0 && h > 0) bg = buildBackground(w, h)
              }

              /** Circuit-board background: chips, pins, parallel trace bundles, glowing lines (ek baar banta hai). */
              private fun buildBackground(w: Int, h: Int): Bitmap {
                  pulses.clear()
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  p.shader = RadialGradient(
                      w / 2f, h * 0.32f, max(w, h) * 0.85f,
                      intArrayOf(0xFF0B2A52.toInt(), 0xFF071426.toInt(), 0xFF03080F.toInt()),
                      floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), p)
                  p.shader = null

                  val rnd = Random(7)
                  val g = w / 18f
                  val rows = (h / g).toInt() + 1
                  val line = max(1.6f, w / 330f)
                  lineW = line
                  val faceRect = RectF(w * 0.12f, h * 0.10f, w * 0.88f, h * 0.58f)
                  val blue = 0x4FA3FF

                  fun argb(a: Int, rgb: Int = blue) = (a shl 24) or rgb

                  fun glowPath(path: Path, a: Int, wid: Float) {
                      p.style = Paint.Style.STROKE
                      p.color = argb(a / 6); p.strokeWidth = wid * 5f; c.drawPath(path, p)
                      p.color = argb(a / 3); p.strokeWidth = wid * 2.6f; c.drawPath(path, p)
                      p.color = argb(a); p.strokeWidth = wid; c.drawPath(path, p)
                  }
                  fun ring(x: Float, y: Float, a: Int) {
                      p.style = Paint.Style.STROKE; p.strokeWidth = line; p.color = argb(a)
                      c.drawCircle(x, y, g * 0.17f, p)
                  }
                  fun addPulse(path: Path) {
                      val pm = PathMeasure(path, false)
                      if (pm.length > g) pulses.add(Pulse(pm, pm.length, 0.05f + rnd.nextFloat() * 0.07f, rnd.nextFloat()))
                  }
                  fun randomTrace(x0: Float, y0: Float): Pair<Path, FloatArray> {
                      var x = x0; var y = y0
                      val path = Path(); path.moveTo(x, y)
                      var horiz = rnd.nextBoolean()
                      repeat(2 + rnd.nextInt(4)) {
                          val len = (1 + rnd.nextInt(3)) * g
                          val dir = if (rnd.nextBoolean()) 1f else -1f
                          if (horiz) x += dir * len else y += dir * len
                          path.lineTo(x, y)
                          if (rnd.nextInt(3) == 0) { x += dir * g * 0.5f; y += dir * g * 0.5f; path.lineTo(x, y) }
                          horiz = !horiz
                      }
                      return path to floatArrayOf(x, y)
                  }

                  // 1) halki traces poore background mein
                  repeat(70) {
                      val (path, end) = randomTrace(rnd.nextInt(19) * g, rnd.nextInt(rows) * g)
                      p.style = Paint.Style.STROKE; p.strokeWidth = line; p.color = argb(0x30)
                      c.drawPath(path, p)
                      p.style = Paint.Style.FILL; p.color = argb(0x40)
                      c.drawCircle(end[0], end[1], line * 2f, p)
                  }

                  // 2) chips (pins ke saath), chehre se door
                  var placed = 0
                  var tries = 0
                  while (placed < 9 && tries < 80) {
                      tries++
                      val cw = (2 + rnd.nextInt(3)) * g
                      val ch = (2 + rnd.nextInt(3)) * g
                      val x = rnd.nextInt(16) * g
                      val y = rnd.nextInt(max(1, rows - 4)) * g
                      val r = RectF(x, y, x + cw, y + ch)
                      if (RectF.intersects(r, faceRect)) continue
                      placed++
                      p.style = Paint.Style.FILL; p.color = argb(0x2A, 0x1A5CA8); c.drawRect(r, p)
                      p.style = Paint.Style.STROKE; p.strokeWidth = line; p.color = argb(0x66); c.drawRect(r, p)
                      val inset = g * 0.4f
                      p.color = argb(0x33)
                      c.drawRect(r.left + inset, r.top + inset, r.right - inset, r.bottom - inset, p)
                      p.color = argb(0x88); p.strokeWidth = line * 0.8f
                      var px = r.left + g * 0.3f
                      while (px < r.right - g * 0.2f) {
                          c.drawLine(px, r.top - g * 0.22f, px, r.top, p)
                          c.drawLine(px, r.bottom, px, r.bottom + g * 0.22f, p)
                          px += g * 0.3f
                      }
                      var py = r.top + g * 0.3f
                      while (py < r.bottom - g * 0.2f) {
                          c.drawLine(r.left - g * 0.22f, py, r.left, py, p)
                          c.drawLine(r.right, py, r.right + g * 0.22f, py, p)
                          py += g * 0.3f
                      }
                  }

                  // 3) parallel trace bundles (kinaron par), 45 degree jog ke saath
                  fun bundle(x0: Float, dir: Float, yStart: Float, y1: Float, y2: Float, count: Int, a: Int) {
                      val gap = line * 3.6f
                      val shift = w * 0.03f
                      for (i in 0 until count) {
                          val x = x0 + dir * i * gap
                          val path = Path()
                          path.moveTo(x, yStart)
                          path.lineTo(x, y1)
                          path.lineTo(x + dir * shift, y1 + shift)
                          path.lineTo(x + dir * shift, y2)
                          glowPath(path, a, line)
                          if (i % 3 == 0) ring(x + dir * shift, y2, a)
                          if (i % 2 == 0) addPulse(path)
                      }
                  }
                  bundle(w * 0.86f, 1f, h * 0.20f, h * 0.38f, h * 0.66f, 7, 0xA0)
                  bundle(w * 0.14f, -1f, h * 0.44f, h * 0.55f, h * 0.80f, 6, 0x70)

                  // 4) chamakti hui traces (chehre ke area se bahar)
                  var made = 0
                  var t2 = 0
                  while (made < 16 && t2 < 120) {
                      t2++
                      val (path, end) = randomTrace(rnd.nextInt(19) * g, rnd.nextInt(rows) * g)
                      val b = RectF()
                      path.computeBounds(b, true)
                      if (RectF.intersects(b, faceRect)) continue
                      made++
                      glowPath(path, 0xA0, line)
                      ring(end[0], end[1], 0xB0)
                      if (made % 2 == 0) addPulse(path)
                  }
                  return bmp
              }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  bg?.let { canvas.drawBitmap(it, 0f, 0f, null) }

                  val now = System.nanoTime() / 1_000_000_000f

                  // traces par chalte hue data-pulses
                  for (pl in pulses) {
                      val d = ((now * pl.speed + pl.phase) % 1f) * pl.len
                      if (pl.pm.getPosTan(d, pos, null)) {
                          fill.color = 0x224FA3FF; canvas.drawCircle(pos[0], pos[1], lineW * 5f, fill)
                          fill.color = 0x554FA3FF; canvas.drawCircle(pos[0], pos[1], lineW * 3f, fill)
                          fill.color = 0xF0D8EEFF.toInt(); canvas.drawCircle(pos[0], pos[1], lineW * 1.4f, fill)
                      }
                  }

                  // smooth animation toward target pose / colour
                  for (i in cur.indices) cur[i] += (tgt[i] - cur[i]) * 0.14f
                  cr += (tr - cr) * 0.12f; cg += (tg - cg) * 0.12f; cb += (tb - cb) * 0.12f
                  talkLerp += ((if (talking) 1f else 0f) - talkLerp) * 0.2f
                  thinkLerp += ((if (thinking) 1f else 0f) - thinkLerp) * 0.15f
                  stressLerp += ((if (emotion == "stressed" && !listening) 1f else 0f) - stressLerp) * 0.1f

                  // blink
                  if (now >= nextBlink) { blinkStart = now; nextBlink = now + 2.5f + Random.nextFloat() * 3f }
                  val bp = (now - blinkStart) / 0.16f
                  val bs = if (bp in 0f..1f) 1f - 0.92f * sin(PI.toFloat() * bp) else 1f

                  val s = min(w, h * 0.8f) / 1000f * 0.95f
                  val bob = sin(now * 1.6f) * 8f * s
                  val shake = sin(now * 45f) * 5f * s * stressLerp
                  val cx = w / 2f + shake
                  val cy = h * 0.32f + bob
                  val gaze = sin(now * 2.2f) * 35f * thinkLerp   // thinking: aankhein idhar-udhar

                  fun X(x: Float, sign: Float) = cx + (sign * x + gaze) * s
                  fun EY(y: Float) = cy + (PIVOT + (y - PIVOT) * bs) * s

                  fun eye(path: Path, sign: Float) {
                      path.reset()
                      path.moveTo(X(cur[0], sign), EY(cur[1]))
                      path.quadTo(X(cur[2], sign), EY(cur[3]), X(cur[4], sign), EY(cur[5]))
                      path.moveTo(X(cur[6], sign), EY(cur[7]))
                      path.quadTo(X(cur[8], sign), EY(cur[9]), X(cur[10], sign), EY(cur[11]))
                  }
                  eye(eyeL, 1f)
                  eye(eyeR, -1f)

                  // mouth (talking: khulta-band hota hai)
                  val open = (sin(now * 12f) * 0.5f + 0.5f) * 120f * talkLerp
                  mouth.reset()
                  mouth.moveTo(cx + cur[12] * s, cy + cur[13] * s)
                  mouth.quadTo(cx + cur[14] * s, cy + (cur[15] + open) * s, cx + cur[16] * s, cy + cur[17] * s)

                  val pulse = if (listening) 0.8f + 0.35f * sin(now * 6f) else 1f
                  val r = cr.toInt().coerceIn(0, 255)
                  val g = cg.toInt().coerceIn(0, 255)
                  val b = cb.toInt().coerceIn(0, 255)

                  for (path in arrayOf(eyeL, eyeR, mouth)) glowStroke(canvas, path, s, pulse, r, g, b)

                  postInvalidateOnAnimation()
              }

              private fun glowStroke(canvas: Canvas, path: Path, s: Float, pulse: Float, r: Int, g: Int, b: Int) {
                  val widths = floatArrayOf(78f, 56f, 38f, 26f)
                  val alphas = intArrayOf(26, 38, 58, 90)
                  for (i in widths.indices) {
                      paint.strokeWidth = widths[i] * s
                      paint.color = Color.argb(min(255, (alphas[i] * pulse).toInt()), r, g, b)
                      canvas.drawPath(path, paint)
                  }
                  paint.strokeWidth = 17f * s
                  paint.color = 0xFFF4FAFF.toInt()
                  canvas.drawPath(path, paint)
              }
          }
