          package com.vineet.dost

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class Reply(val text: String, val toolCalls: List<Pair<String, JSONObject>>)

          /** Google Gemini API (free tier) client with function calling. */
          object GeminiClient {

              // Model yahan badal sakte ho, jaise "gemini-2.5-flash" (zyada smart, limit kam)
              const val MODEL = "gemini-2.5-flash-lite"

              private const val SYSTEM = """
          Tum "Aira" ho, Vineet ki personal AI dost. Hinglish (Hindi + English, Roman script) mein bilkul casual, warm aur thodi mazaakiya andaaz mein baat karti ho, jaise ek close dost. Jawab chhote rakho (1-3 vaakya) kyunki tumhari baat bolkar sunayi jaati hai. Emoji, markdown, bullet points mat use karo.
          Jo user bole uska seedha, sahi jawab do. Zarurat ho to pyaar se pushback bhi karo.
          Har jawab ki bilkul shuruaat mein ek tag likho: [user:mood] jahan mood in mein se ek ho: happy, excited, sad, angry, stressed, neutral. Ye user ke abhi ke mood ka tumhara andaza hai (uske shabdon aur [voice hint: ...] se, jo awaaz ki tezi/volume/speed batata hai). Tag ke baad apna jawab mood ke hisaab se do: sad ya stressed ho to naram aur care ke saath, angry ho to shaant rehkar, happy/excited ho to usi josh mein. [voice hint] ko kabhi bolkar mat padhna aur tag ke baare mein kuch mat kehna. Mood sirf andaza hai, pakka mat maan lena.
          Jab user phone se kuch karwana chahe (app kholna, google search, gaana chalana, screen lock), to tool call karo aur saath mein ek chhoti friendly line bhi likho (jaise "Lo, khol diya!"). Tum screen unlock nahi kar sakti (Android security ki wajah se) - ye ho to dost ki tarah bata do ki phone ko haath se unlock karna padega.
          """

              private fun str(desc: String) = JSONObject().put("type", "STRING").put("description", desc)

              private fun fn(name: String, desc: String, param: String?, pdesc: String = ""): JSONObject {
                  val f = JSONObject().put("name", name).put("description", desc)
                  if (param != null) {
                      f.put("parameters", JSONObject()
                          .put("type", "OBJECT")
                          .put("properties", JSONObject().put(param, str(pdesc)))
                          .put("required", JSONArray().put(param)))
                  }
                  return f
              }

              private val TOOLS = JSONArray().put(
                  JSONObject().put("functionDeclarations", JSONArray()
                      .put(fn("open_app", "Phone mein koi app kholo, uske naam se.", "app_name", "App ka naam"))
                      .put(fn("web_search", "Google par kuch search karo.", "query", "Search query"))
                      .put(fn("play_music", "Koi gaana ya artist chalao.", "song", "Gaane ya artist ka naam"))
                      .put(fn("lock_screen", "Phone ki screen lock karo.", null))
                  )
              )

              /** history: [{"role":"user"|"assistant","content":"text"}, ...] */
              fun chat(apiKey: String, history: JSONArray): Reply {
                  val contents = JSONArray()
                  for (i in 0 until history.length()) {
                      val m = history.getJSONObject(i)
                      contents.put(JSONObject()
                          .put("role", if (m.getString("role") == "assistant") "model" else "user")
                          .put("parts", JSONArray().put(JSONObject().put("text", m.getString("content")))))
                  }
                  val body = JSONObject()
                      .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", SYSTEM.trim()))))
                      .put("contents", contents)
                      .put("tools", TOOLS)
                      .put("generationConfig", JSONObject().put("maxOutputTokens", 400))

                  val url = "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent"
                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.connectTimeout = 15000
                  conn.readTimeout = 60000
                  conn.doOutput = true
                  conn.setRequestProperty("content-type", "application/json")
                  conn.setRequestProperty("x-goog-api-key", apiKey)
                  conn.outputStream.use { it.write(body.toString().toByteArray()) }

                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val raw = stream.bufferedReader().readText()
                  if (code == 429) throw RuntimeException("Free limit poori ho gayi, 1 minute baad dobara bolo.")
                  if (code !in 200..299) throw RuntimeException("API error $code: ${raw.take(300)}")

                  val cands = JSONObject(raw).optJSONArray("candidates")
                  val parts = cands?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts") ?: JSONArray()
                  val sb = StringBuilder()
                  val calls = mutableListOf<Pair<String, JSONObject>>()
                  for (i in 0 until parts.length()) {
                      val p = parts.getJSONObject(i)
                      if (p.has("text")) sb.append(p.getString("text"))
                      p.optJSONObject("functionCall")?.let { fc ->
                          calls.add(fc.getString("name") to (fc.optJSONObject("args") ?: JSONObject()))
                      }
                  }
                  return Reply(sb.toString().trim(), calls)
              }
          }
