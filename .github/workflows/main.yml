name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create project files
        run: |
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'__EOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vineet.dost"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.vineet.dost"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              androidResources { noCompress += listOf("onnx") }
          }

          dependencies {
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.19.2")
          }
          __EOF__
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'__EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="Dost AI"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LockService"
                      android:exported="false"
                      android:label="Dost AI Screen Lock"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/Actions.kt" <<'__EOF__'
          package com.vineet.dost

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.provider.MediaStore
          import android.provider.Settings
          import org.json.JSONObject
          import java.net.URLEncoder

          object Actions {

              /** Tool call chalata hai aur ek chhota result string lautata hai. */
              fun run(ctx: Context, name: String, input: JSONObject): String = try {
                  when (name) {
                      "open_app" -> openApp(ctx, input.optString("app_name"))
                      "web_search" -> webSearch(ctx, input.optString("query"))
                      "play_music" -> playMusic(ctx, input.optString("song"))
                      "lock_screen" -> lockScreen(ctx)
                      else -> "unknown action"
                  }
              } catch (e: Exception) {
                  "error: ${e.message}"
              }

              private fun start(ctx: Context, i: Intent) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
              }

              private fun openApp(ctx: Context, name: String): String {
                  val pm = ctx.packageManager
                  val launcher = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(launcher, 0)
                  val q = name.trim().lowercase()
                  val match = apps.firstOrNull { it.loadLabel(pm).toString().lowercase() == q }
                      ?: apps.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(q) }
                      ?: return "app not found: $name"
                  val i = pm.getLaunchIntentForPackage(match.activityInfo.packageName)
                      ?: return "cannot launch $name"
                  start(ctx, i)
                  return "opened ${match.loadLabel(pm)}"
              }

              private fun webSearch(ctx: Context, q: String): String {
                  val url = "https://www.google.com/search?q=" + URLEncoder.encode(q, "UTF-8")
                  start(ctx, Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                  return "searched: $q"
              }

              private fun playMusic(ctx: Context, song: String): String {
                  return try {
                      val i = Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH).apply {
                          putExtra(MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*")
                          putExtra(android.app.SearchManager.QUERY, song)
                      }
                      start(ctx, i)
                      "playing: $song"
                  } catch (e: Exception) {
                      val url = "https://www.youtube.com/results?search_query=" + URLEncoder.encode(song, "UTF-8")
                      start(ctx, Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                      "opened youtube search: $song"
                  }
              }

              private fun lockScreen(ctx: Context): String {
                  return if (LockService.lock()) {
                      "locked"
                  } else {
                      start(ctx, Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      "accessibility service off - opened settings so user can enable Dost AI Screen Lock"
                  }
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/Analyzer.kt" <<'__EOF__'
          package com.vineet.dost

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import android.content.Context
          import org.json.JSONObject
          import java.io.File
          import java.nio.FloatBuffer
          import kotlin.math.exp
          import kotlin.math.sqrt

          /** Asli ML: speaker embedding (kaun bol raha hai) + speech emotion (kaise bol raha hai). */
          object Analyzer {
              private var env: OrtEnvironment? = null
              private var spk: OrtSession? = null
              private var emo: OrtSession? = null
              private var labels: List<String> = emptyList()

              @Volatile var spkReady = false
              @Volatile var emoReady = false

              fun init(ctx: Context) {
                  try { env = OrtEnvironment.getEnvironment() } catch (e: Throwable) { return }
                  spk = load(ctx, "speaker.onnx"); spkReady = spk != null
                  emo = load(ctx, "emotion.onnx"); emoReady = emo != null
                  try {
                      val txt = ctx.assets.open("emotion_config.json").bufferedReader().readText()
                      val m = JSONObject(txt).getJSONObject("id2label")
                      labels = m.keys().asSequence().map { it.toInt() }.sorted().map { m.getString(it.toString()).lowercase() }.toList()
                  } catch (e: Exception) { emoReady = false }
              }

              private fun load(ctx: Context, asset: String): OrtSession? {
                  val f = File(ctx.filesDir, asset)
                  return try {
                      if (!f.exists() || f.length() == 0L) {
                          ctx.assets.open(asset).use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      }
                      env!!.createSession(f.absolutePath, OrtSession.SessionOptions())
                  } catch (e: Throwable) {
                      f.delete(); null
                  }
              }

              /** Speaker embedding (L2-normalized). */
              fun embedding(pcm: ShortArray): FloatArray? {
                  val s = spk ?: return null
                  return try {
                      val fb = Fbank.compute(pcm) ?: return null
                      val t = fb.size
                      val flat = FloatArray(t * 80)
                      for (i in 0 until t) System.arraycopy(fb[i], 0, flat, i * 80, 80)
                      OnnxTensor.createTensor(env, FloatBuffer.wrap(flat), longArrayOf(1, t.toLong(), 80)).use { tensor ->
                          s.run(mapOf(s.inputNames.first() to tensor)).use { r ->
                              val v = r.get(0).value
                              val e = if (v is Array<*>) v[0] as FloatArray else v as FloatArray
                              l2(e)
                          }
                      }
                  } catch (e: Throwable) { null }
              }

              /** Emotion: (label, probability). */
              fun emotion(pcm: ShortArray): Pair<String, Float>? {
                  val s = emo ?: return null
                  if (labels.isEmpty() || pcm.size < 8000) return null
                  return try {
                      val n = minOf(pcm.size, 16000 * 10)
                      val x = FloatArray(n) { pcm[pcm.size - n + it] / 32768f }
                      var mean = 0f; for (v in x) mean += v; mean /= n
                      var varr = 0f; for (v in x) varr += (v - mean) * (v - mean); varr /= n
                      val inv = 1f / sqrt(varr + 1e-7f)
                      for (i in x.indices) x[i] = (x[i] - mean) * inv
                      OnnxTensor.createTensor(env, FloatBuffer.wrap(x), longArrayOf(1, n.toLong())).use { tensor ->
                          s.run(mapOf(s.inputNames.first() to tensor)).use { r ->
                              val logits = (r.get(0).value as Array<*>)[0] as FloatArray
                              val mx = logits.max()
                              val ex = logits.map { exp((it - mx).toDouble()).toFloat() }
                              val sum = ex.sum()
                              val best = ex.indices.maxByOrNull { ex[it] }!!
                              labels.getOrElse(best) { "neutral" } to ex[best] / sum
                          }
                      }
                  } catch (e: Throwable) { null }
              }

              fun cosine(a: FloatArray, b: FloatArray): Float {
                  var d = 0f
                  for (i in 0 until minOf(a.size, b.size)) d += a[i] * b[i]
                  return d
              }

              fun l2(v: FloatArray): FloatArray {
                  var n = 0f; for (x in v) n += x * x
                  val s = 1f / sqrt(n + 1e-9f)
                  return FloatArray(v.size) { v[it] * s }
              }

              /** Model ke label ko hamare mood mein badlo. */
              fun toMood(label: String) = when (label) {
                  "angry", "disgust" -> "angry"
                  "fear", "fearful" -> "stressed"
                  "happy" -> "happy"
                  "surprise", "surprised" -> "excited"
                  "sad" -> "sad"
                  else -> "neutral"
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/AudioCapture.kt" <<'__EOF__'
          package com.vineet.dost

          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder

          /** Raw 16 kHz mono mic audio ko ring buffer mein rakhta hai (voice + emotion analysis ke liye). */
          class AudioCapture {
              private val sr = 16000
              private val ring = ShortArray(sr * 15)
              private var total = 0L
              private var rec: AudioRecord? = null
              @Volatile private var running = false

              fun start(): Boolean {
                  if (running) return true
                  return try {
                      val min = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                      val r = AudioRecord(
                          MediaRecorder.AudioSource.VOICE_RECOGNITION, sr,
                          AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, maxOf(min, sr)
                      )
                      if (r.state != AudioRecord.STATE_INITIALIZED) { r.release(); return false }
                      synchronized(ring) { total = 0L }
                      rec = r
                      r.startRecording()
                      running = true
                      Thread {
                          val buf = ShortArray(1024)
                          while (running) {
                              val n = r.read(buf, 0, buf.size)
                              if (n <= 0) { if (n < 0) break else continue }
                              synchronized(ring) {
                                  for (i in 0 until n) { ring[(total % ring.size).toInt()] = buf[i]; total++ }
                              }
                          }
                      }.start()
                      true
                  } catch (e: Exception) { false }
              }

              /** Aakhri `seconds` second ki audio. */
              fun snapshot(seconds: Float): ShortArray = synchronized(ring) {
                  val want = minOf((seconds * sr).toInt(), ring.size, total.toInt())
                  ShortArray(want) { i -> ring[((total - want + i) % ring.size).toInt()] }
              }

              fun stop() {
                  running = false
                  try { rec?.stop() } catch (_: Exception) {}
                  try { rec?.release() } catch (_: Exception) {}
                  rec = null
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/ClaudeClient.kt" <<'__EOF__'
          package com.vineet.dost

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class Reply(val text: String, val toolCalls: List<Pair<String, JSONObject>>)

          object ClaudeClient {

              // Model yahan badal sakte ho (jaise "claude-haiku-5-5" = tez aur sasta)
              const val MODEL = "claude-sonnet-5-5"

              private const val SYSTEM = """
          Tum "Dost" ho, Vineet ki personal AI dost. Hinglish (Hindi + English, Roman script) mein bilkul casual, warm aur thodi mazaakiya andaaz mein baat karti ho, jaise ek close dost. Jawab chhote rakho (1-3 vaakya) kyunki tumhari baat bolkar sunayi jaati hai. Emoji, markdown, bullet points mat use karo.
          Jo user bole uska seedha, sahi jawab do. Zarurat ho to pyaar se pushback bhi karo.
          Har jawab ki bilkul shuruaat mein ek tag likho: [user:mood] jahan mood in mein se ek ho: happy, excited, sad, angry, stressed, neutral. Ye user ke abhi ke mood ka tumhara andaza hai (uske shabdon aur [voice hint: ...] se, jo awaaz ki tezi/volume/speed batata hai). Tag ke baad apna jawab mood ke hisaab se do: sad ya stressed ho to naram aur care ke saath, angry ho to shaant rehkar, happy/excited ho to usi josh mein. [voice hint] ko kabhi bolkar mat padhna aur tag ke baare mein kuch mat kehna. Mood sirf andaza hai, pakka mat maan lena.
          Jab user phone se kuch karwana chahe (app kholna, google search, gaana chalana, screen lock), to tool call karo aur saath mein ek chhoti friendly line bhi likho (jaise "Lo, khol diya!"). Tum screen unlock nahi kar sakti (Android security ki wajah se) - ye ho to dost ki tarah bata do ki phone ko haath se unlock karna padega.
          """

              private val TOOLS = JSONArray(
                  """
          [
           {"name":"open_app","description":"Phone mein koi app kholo, uske naam se.",
            "input_schema":{"type":"object","properties":{"app_name":{"type":"string"}},"required":["app_name"]}},
           {"name":"web_search","description":"Google par kuch search karo.",
            "input_schema":{"type":"object","properties":{"query":{"type":"string"}},"required":["query"]}},
           {"name":"play_music","description":"Koi gaana ya artist chalao.",
            "input_schema":{"type":"object","properties":{"song":{"type":"string"}},"required":["song"]}},
           {"name":"lock_screen","description":"Phone ki screen lock karo.",
            "input_schema":{"type":"object","properties":{}}}
          ]
          """
              )

              fun chat(apiKey: String, history: JSONArray): Reply {
                  val body = JSONObject()
                      .put("model", MODEL)
                      .put("max_tokens", 400)
                      .put("system", SYSTEM.trim())
                      .put("tools", TOOLS)
                      .put("messages", history)

                  val conn = (URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection)
                  conn.requestMethod = "POST"
                  conn.connectTimeout = 15000
                  conn.readTimeout = 60000
                  conn.doOutput = true
                  conn.setRequestProperty("content-type", "application/json")
                  conn.setRequestProperty("x-api-key", apiKey)
                  conn.setRequestProperty("anthropic-version", "2023-06-01")
                  conn.outputStream.use { it.write(body.toString().toByteArray()) }

                  val code = conn.responseCode
                  val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                  val raw = stream.bufferedReader().readText()
                  if (code !in 200..299) throw RuntimeException("API error $code: $raw")

                  val content = JSONObject(raw).getJSONArray("content")
                  val sb = StringBuilder()
                  val calls = mutableListOf<Pair<String, JSONObject>>()
                  for (i in 0 until content.length()) {
                      val b = content.getJSONObject(i)
                      when (b.getString("type")) {
                          "text" -> sb.append(b.getString("text"))
                          "tool_use" -> calls.add(b.getString("name") to b.getJSONObject("input"))
                      }
                  }
                  return Reply(sb.toString().trim(), calls)
              }
          }
          __EOF__
          mkdir -p "app/src/main/java/com/vineet/dost"
          cat > "app/src/main/java/com/vineet/dost/Fbank.kt" <<'__EOF__'
          package com.vineet.dost

          import kotl
